name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # `npm ci` compiles the addon through the gypfile; there is no install
      # script and no prebuild to download.
      - name: Install dependencies and build the addon
        run: npm ci
      # The suite runs in test mode: real escalation puts up an Authorization
      # prompt on macOS, a UAC dialog on Windows and a polkit agent on Linux,
      # none of which a runner can answer. What is covered is the JS surface,
      # the callback and error paths, and that the addon loads at all.
      - name: Run tests
        run: npm test
      - name: Validate package contents
        run: npm pack --dry-run
